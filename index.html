<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14323d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: #14323d; } body { margin: 0; }</style>
<title>Ace Wingfield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: one full-height column. Sky playfield on top, thumb controls underneath. Menus are HTML overlays on the playfield. Single committed look: mid-century storybook sky, ink outlines, teal and sun yellow. */
:root {
  --sky-top: #6db8e4;
  --sky-bot: #fbe8c6;
  --ink: #14323d;
  --teal: #2a9d8f;
  --sun: #f2b632;
  --coral: #e85d4a;
  --cream: #f6ead0;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--cream);
  font-family: var(--body);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.app { height: 100%; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
#stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
canvas {
  display: block;
  background: var(--sky-top);
  border-radius: 14px;
  box-shadow: 0 0 0 3px var(--cream);
  touch-action: none;
  max-width: 100%;
}
.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn {
  font-family: var(--display);
  letter-spacing: 0.04em;
  border: 0;
  border-radius: 14px;
  height: 62px;
  font-size: 20px;
  color: var(--ink);
  touch-action: none;
  cursor: pointer;
  min-width: 0;
}
.btn:focus-visible, .tog:focus-visible, .mbtn:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.btn.fire { flex: 2 1 160px; background: var(--coral); color: var(--cream); box-shadow: 0 5px 0 #a63a2c; }
.btn.loop { flex: 1 1 90px; background: var(--sun); box-shadow: 0 5px 0 #b98a14; }
.btn:active, .btn.down { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
.row2 { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; width: 100%; }
.tog {
  font-family: var(--body);
  font-weight: 600;
  font-size: 14px;
  background: transparent;
  color: var(--cream);
  border: 2px solid rgba(246,234,208,.45);
  border-radius: 999px;
  padding: 6px 14px;
  cursor: pointer;
}
.tog[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: var(--cream); }
.tog.act { border-color: var(--sun); color: var(--sun); }
.hint { font-size: 13px; opacity: .75; text-align: center; min-width: 0; }
.rotate { display: none; font-size: 13px; color: var(--sun); text-align: center; }
@media (orientation: portrait) and (pointer: coarse) { .rotate { display: block; } .hint { display: none; } }
@media (max-height: 520px) {
  .btn { height: 48px; font-size: 17px; }
  .hint, .rotate { display: none; }
  .tog { padding: 4px 11px; font-size: 13px; }
  .row2 { width: auto; flex: 1 1 auto; }
}

/* pause menu */
.ov {
  position: absolute; inset: 0; z-index: 5;
  display: flex; padding: 12px; overflow: auto;
  background: rgba(20, 50, 61, 0.74);
  border-radius: 14px;
}
.card {
  margin: auto; width: min(330px, 100%);
  display: flex; flex-direction: column; gap: 10px;
  background: var(--cream); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 18px;
  padding: 16px 18px;
  box-shadow: 0 6px 0 rgba(0, 0, 0, .35);
}
.card h2 { font-family: var(--display); font-size: 28px; letter-spacing: .04em; margin: 0; text-align: center; }
.card .small { margin: 0; font-size: 13px; text-align: center; opacity: .75; }
.mbtn {
  font-family: var(--display); font-size: 16px; letter-spacing: .03em;
  height: 46px; border-radius: 12px; cursor: pointer;
  border: 2px solid var(--ink); background: #fff7e0; color: var(--ink);
}
.mbtn.primary { background: var(--sun); box-shadow: 0 4px 0 #b98a14; }
.mbtn:active { transform: translateY(2px); }
.mgrid { display: flex; flex-direction: column; gap: 10px; }
.ini { font-family: var(--display); font-size: 34px; letter-spacing: .3em; text-align: center; text-transform: uppercase; width: 100%; padding: 6px 0 6px .3em; border: 3px solid var(--ink); border-radius: 12px; background: #fff7e0; color: var(--ink); }
.ini:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.board { list-style: none; margin: 0; padding: 0; }
.board li { display: grid; grid-template-columns: 2.2em 1fr auto auto; gap: 8px; align-items: baseline; padding: 4px 10px; margin-bottom: 3px; border-radius: 8px; font-variant-numeric: tabular-nums; }
.board li.me { background: var(--sun); }
.board .rk { opacity: .6; }
.board .nm { font-family: var(--display); letter-spacing: .12em; }
.board .sc { font-weight: 600; }
.board .wv { opacity: .6; font-size: 13px; }
@media (max-height: 520px) {
  .ov { padding: 8px; }
  .card { width: min(480px, 100%); padding: 10px 14px; gap: 6px; }
  .card h2 { font-size: 20px; }
  .card .note { display: none; }
  .mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mbtn { height: 38px; font-size: 14px; }
  .ini { font-size: 26px; }
  .board { column-count: 2; column-gap: 12px; }
  .board li { break-inside: avoid; padding: 2px 8px; margin-bottom: 2px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { .btn:active, .mbtn:active { transform: none; } }
</style>

</head>
<body>
<div class="app">
  <div id="stage">
    <canvas id="c" width="720" height="450" aria-label="Ace Wingfield game screen"></canvas>
    <div class="ov" id="ovPause" hidden>
      <div class="card" role="dialog" aria-label="Paused">
        <h2>PAUSED</h2>
        <p class="small" id="pInfo"></p>
        <div class="mgrid">
          <button class="mbtn primary" id="mResume" type="button">Resume</button>
          <button class="mbtn" id="mRestart" type="button">Restart run</button>
          <button class="mbtn" id="mPractice" type="button">Practice flight</button>
          <button class="mbtn" id="mSkip" type="button" hidden>Skip tutorial</button>
          <button class="mbtn" id="mQuit" type="button">Quit to title</button>
        </div>
        <p class="small note">P or Esc also pauses. Music and sound switches are below the playfield.</p>
      </div>
    </div>
    <div class="ov" id="ovScore" hidden>
      <div class="card" role="dialog" aria-label="Post your score">
        <h2 id="sTitle">POST YOUR SCORE</h2>
        <p class="small" id="sInfo"></p>
        <label class="small" for="ini">Your initials</label>
        <input class="ini" id="ini" type="text" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ACE">
        <div class="mgrid">
          <button class="mbtn primary" id="sSave" type="button">Post score</button>
          <button class="mbtn" id="sSkip" type="button">Skip</button>
        </div>
        <p class="small" id="sMsg" role="status"></p>
      </div>
    </div>
    <div class="ov" id="ovBoard" hidden>
      <div class="card" role="dialog" aria-label="High scores">
        <h2>TOP ACES</h2>
        <ol class="board" id="bList"></ol>
        <p class="small" id="bNote" role="status"></p>
        <button class="mbtn primary" id="bClose" type="button">Close</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="btn loop" id="btnLoop" type="button">LOOP</button>
    <button class="btn fire" id="btnFire" type="button">FIRE</button>
    <div class="row2">
      <button class="tog act" id="btnPause" type="button" hidden>Pause</button>
      <button class="tog" id="togHow" type="button">How to play</button>
      <button class="tog" id="togScores" type="button" hidden>High scores</button>
      <button class="tog act" id="togSkip" type="button" hidden>Skip tutorial</button>
      <button class="tog" id="togAuto" type="button" aria-pressed="false">Auto-fire</button>
      <button class="tog" id="togMusic" type="button" aria-pressed="true">Music</button>
      <button class="tog" id="togSound" type="button" aria-pressed="true">Sound</button>
    </div>
    <div class="hint">Arrows or WASD to fly &middot; Space to fire &middot; Shift to loop (no hits mid-loop) &middot; P to pause</div>
    <div class="rotate">Turn your phone sideways for a bigger sky. Drag on the sky to fly.</div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d'), stage = document.getElementById('stage');
  const $ = id => document.getElementById(id);
  let W = 720, H = 450, K = 1;
  const INK = '#14323d';
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const hsh = k => { const s = Math.sin(k * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  let COARSE = false;
  try { COARSE = window.matchMedia('(pointer: coarse)').matches; } catch (e) {}

  function fit() {
    const bw = stage.clientWidth, bh = stage.clientHeight;
    if (bw < 10 || bh < 10) return;
    W = Math.round(clamp(H * (bw / bh), 640, 840));
    const s = Math.min(bw / W, bh / H);
    const cssW = Math.floor(W * s), cssH = Math.floor(H * s);
    cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
    K = cv.width / W;
    makeClouds();
  }

  /* paper grain, drawn once into a tile */
  let grain = null;
  (function makeGrain() {
    try {
      const g = document.createElement('canvas'); g.width = g.height = 128;
      const gx = g.getContext('2d'), id = gx.createImageData(128, 128);
      for (let i = 0; i < id.data.length; i += 4) {
        const dark = Math.random() < 0.5, v = dark ? 20 : 255;
        id.data[i] = v; id.data[i + 1] = v; id.data[i + 2] = v; id.data[i + 3] = Math.random() * 20;
      }
      gx.putImageData(id, 0, 0);
      grain = ctx.createPattern(g, 'repeat');
    } catch (e) { grain = null; }
  })();

  /* ---------- audio: effects ---------- */
  let AC = null, mGain = null, noiseBuf = null, sfxOn = true, musicOn = true;
  function initAudio() {
    if (!AC) {
      try {
        const a = new (window.AudioContext || window.webkitAudioContext)();
        const g = a.createGain(); g.gain.value = 0.9; g.connect(a.destination);
        const n = Math.floor(a.sampleRate * 0.25), nb = a.createBuffer(1, n, a.sampleRate), d = nb.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        noiseBuf = nb; mGain = g; AC = a;
      } catch (e) { AC = null; mGain = null; noiseBuf = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
  }
  function tone(f1, f2, dur, type, vol) {
    if (!AC || !sfxOn) return;
    const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur);
  }
  function sfx(k) {
    if (k === 'shoot') tone(900, 420, 0.07, 'square', 0.025);
    else if (k === 'hit') tone(220, 60, 0.28, 'sawtooth', 0.08);
    else if (k === 'boom') tone(130, 30, 0.4, 'sawtooth', 0.09);
    else if (k === 'pick') tone(520, 1100, 0.18, 'triangle', 0.07);
    else if (k === 'loop') tone(280, 760, 0.45, 'sine', 0.05);
    else if (k === 'ping') tone(700, 500, 0.05, 'triangle', 0.03);
    else if (k === 'dive') tone(620, 140, 0.4, 'sawtooth', 0.035);
    else if (k === 'warn') tone(330, 560, 0.32, 'square', 0.045);
    else if (k === 'step') tone(600, 1200, 0.2, 'triangle', 0.06);
    else if (k === 'thunder') tone(110, 32, 0.9, 'sawtooth', 0.06);
  }

  /* ---------- audio: music (synthesized, scheduled ahead of time) ---------- */
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  const PA = [76,0,72,0,79,0,76,72, 81,0,76,0,72,76,81,0, 77,0,72,0,81,0,77,72, 79,0,74,0,71,74,79,0];
  const PB = [84,0,79,76,72,0,76,79, 81,0,76,0,81,0,84,81, 77,81,84,81,77,0,72,0, 79,0,83,0,86,0,0,0];
  const PC = [81,0,0,81,84,0,83,0, 77,0,0,77,81,0,79,0, 79,0,0,79,83,0,81,0, 76,0,80,0,83,0,80,76];
  const SONGS = {
    title: { bpm: 92,  roots: [48, 45, 41, 43], phr: [PA],     lead: 'triangle', leadVol: 0.07,  bass: 'long',  drums: false },
    play:  { bpm: 132, roots: [48, 45, 41, 43], phr: [PA, PB], lead: 'square',   leadVol: 0.026, bass: 'walk',  drums: true },
    boss:  { bpm: 160, roots: [45, 41, 43, 40], phr: [PC],     lead: 'square',   leadVol: 0.03,  bass: 'pulse', drums: true, hat: 'all' }
  };
  let musicMode = 'none', mStep = 0, mNext = 0, mReset = true;
  function setMusic(m) { if (m === musicMode) return; musicMode = m; mStep = 0; mReset = true; }
  function mtone(f, t, dur, type, vol) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(mGain); o.start(t); o.stop(t + dur + 0.02);
  }
  function mnoise(t, dur, vol, ftype, freq) {
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = ftype; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(mGain); s.start(t); s.stop(t + dur + 0.02);
  }
  function mkick(t) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.14, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(mGain); o.start(t); o.stop(t + 0.2);
  }
  function playStep(S, step, t, sd) {
    const i = step % 32, loop = Math.floor(step / 32), bar = i >> 3, b = i & 7;
    const ph = S.phr[loop % S.phr.length], root = S.roots[bar], m = ph[i];
    if (m) mtone(mf(m), t, sd * 1.7, S.lead, S.leadVol);
    if (S.bass === 'walk') { if (!(b & 1)) mtone(mf(root + (b === 2 || b === 6 ? 7 : 0)), t, sd * 1.8, 'triangle', 0.1); }
    else if (S.bass === 'pulse') mtone(mf(root + ((b & 1) ? 12 : 0)), t, sd * 0.9, 'triangle', 0.09);
    else if (S.bass === 'long') { if (b === 0) mtone(mf(root), t, sd * 7, 'triangle', 0.08); }
    if (S.drums) {
      if (b === 0 || b === 4) mkick(t);
      if (b === 2 || b === 6) mnoise(t, 0.09, 0.05, 'bandpass', 1800);
      if (S.hat === 'all' || (b & 1)) mnoise(t, 0.03, 0.02, 'highpass', 7000);
    }
  }
  function musicTick() {
    if (!AC || !mGain || AC.state !== 'running' || !musicOn || paused || document.hidden || musicMode === 'none') { mReset = true; return; }
    const S = SONGS[musicMode], sd = 60 / S.bpm / 2, now = AC.currentTime;
    if (mReset || mNext < now - 0.1) { mNext = now + 0.06; mReset = false; }
    while (mNext < now + 0.25) { playStep(S, mStep, mNext, sd); mNext += sd; mStep++; }
  }
  setInterval(musicTick, 45);

  /* ---------- state ---------- */
  let state = 'title', paused = false, T = 0, worldX = 0, score = 0, best = 0, kills = 0, shake = 0;
  try { best = +localStorage.getItem('aw_best') || 0; } catch (e) {}
  const P = { x: 120, y: 225, vx: 0, vy: 0, hp: 3, inv: 0, fire: 0, rapid: 0, spread: 0, shield: 0, loop: 0, loopCd: 0, ang: 0, dead: false, puff: 0, smoke: 0 };
  let bullets = [], eb = [], en = [], pk = [], pt = [], boss = null, spawnT = 1, nextBoss = 20, bossesDone = 0, deadT = 0, newBest = false;
  let warn = 0, bossPending = false, lastWarnK = -1, tut = null, flashW = 0;
  let clouds = [];
  const LOOP_T = 0.7, LOOP_CD = 2.6;
  const level = () => 1 + Math.floor(kills / 8);

  const DEF = {
    scout:  { hp: 1, w: 52, h: 28, sp: 100, score: 100, s: 1 },
    ace:    { hp: 2, w: 54, h: 28, sp: 150, score: 250, s: 1 },
    bomber: { hp: 5, w: 92, h: 46, sp: 55,  score: 500, s: 1.6 },
    diver:  { hp: 1, w: 46, h: 26, sp: 170, score: 150, s: 0.9 },
    mine:   { hp: 1, w: 34, h: 34, sp: 50,  score: 75,  s: 1 }
  };
  const PAL = {
    hero:   { body: '#2a9d8f', light: '#63c9ba', wing: '#f6ead0', dark: '#14323d', stripe: '#f2b632' },
    scout:  { body: '#6f8f3b', light: '#9dbb5c', wing: '#b4c878', dark: '#2c3a16', stripe: '#e8d36a' },
    ace:    { body: '#7a4fa3', light: '#a47fcb', wing: '#c0a6dc', dark: '#2d1b42', stripe: '#f2b632' },
    bomber: { body: '#b8662b', light: '#de9250', wing: '#e8b07a', dark: '#4a2a10', stripe: '#f6ead0' },
    diver:  { body: '#d9482b', light: '#f07a52', wing: '#f1b9a0', dark: '#4a1a10', stripe: '#f6ead0' },
    baron:  { body: '#b3262b', light: '#e0575a', wing: '#e8c9a0', dark: '#2a0d10', stripe: '#14323d' }
  };
  const BOSS_DEFS = [
    { name: 'THE GRAND GASBAG', hp: 30, rx: 100, ry: 42, oy: 0 },
    { name: 'BARON BUZZSAW',    hp: 26, rx: 62,  ry: 38, oy: -8 },
    { name: 'THUNDER BARGE',    hp: 38, rx: 108, ry: 38, oy: 0 }
  ];

  function makeClouds() {
    clouds = [];
    const layers = [{ n: 4, sp: 8, a: 0.6, s: 0.7, y0: 30, y1: 190 }, { n: 4, sp: 22, a: 0.95, s: 1.1, y0: 60, y1: 280 }];
    for (const L of layers) for (let i = 0; i < L.n; i++) clouds.push({ x: rnd(0, W + 300) - 100, y: rnd(L.y0, L.y1), r: rnd(22, 38) * L.s, sp: L.sp * rnd(0.8, 1.2), a: L.a });
  }

  /* ---------- buttons and UI state ---------- */
  const btnPause = $('btnPause'), togHow = $('togHow'), togScores = $('togScores'), togSkip = $('togSkip'), togAuto = $('togAuto'), togMusic = $('togMusic'), togSound = $('togSound');
  const ovPause = $('ovPause');
  function updUI() {
    btnPause.hidden = state !== 'play';
    togHow.hidden = state === 'play';
    togScores.hidden = state === 'play' || !hs.db;
    togSkip.hidden = !(state === 'play' && tut);
  }

  function reset(withTut) {
    Object.assign(P, { x: 110, y: H / 2, vx: 0, vy: 0, hp: 3, inv: withTut ? 0 : 1.5, fire: 0, rapid: 0, spread: 0, shield: 0, loop: 0, loopCd: 0, ang: 0, dead: false, puff: 0, smoke: 0 });
    bullets = []; eb = []; en = []; pk = []; pt = []; boss = null;
    spawnT = 1; score = 0; kills = 0; nextBoss = 20; bossesDone = 0; deadT = 0; newBest = false; shake = 0;
    warn = 0; bossPending = false; lastWarnK = -1; paused = false; ovPause.hidden = true; ovScore.hidden = true; ovBoard.hidden = true; resetTheme(); flashW = 0;
    tut = withTut ? { step: 0, t: 0, moved: 0, tkills: 0, looped: false, lt: 0, picked: false } : null;
    if (withTut) { try { localStorage.setItem('aw_tut', '1'); } catch (e) {} }
    state = 'play';
    setMusic(withTut ? 'title' : 'play');
    updUI();
  }
  function begin() {
    if (state === 'play' || modalOpen()) return;
    let first = false;
    try { first = !localStorage.getItem('aw_tut'); } catch (e) {}
    reset(first);
  }
  function toTitle() {
    bullets = []; eb = []; en = []; pk = []; boss = null; tut = null; warn = 0; bossPending = false; paused = false; ovPause.hidden = true; ovScore.hidden = true; ovBoard.hidden = true; resetTheme(); flashW = 0;
    state = 'title'; setMusic('title'); updUI();
  }

  function setPause(v) {
    if (v && (state !== 'play' || P.dead || paused)) return;
    if (!v && !paused) return;

  function doLoop() {

  /* ---------- particles ---------- */
  function puff(x, y, col, r, life, vx, vy) { pt.push({ x, y, vx: vx || 0, vy: vy || 0, life, max: life, r, col, kind: 'puff' }); }
  function explode(x, y, n, big) {
    const cols = ['#f2b632', '#e85d4a', '#f6ead0', '#ff8a3d'];
    pt.push({ x, y, vx: 0, vy: 0, life: 0.18, max: 0.18, r: big ? 22 : 12, col: '#fff3b0', kind: 'flash' });
    pt.push({ x, y, vx: 0, vy: 0, life: 0.4, max: 0.4, r: 6, col: '#f6ead0', kind: 'ring', grow: big ? 260 : 170 });
    for (let i = 0; i < n; i++) {
      const a = rnd(0, 6.283), sp = rnd(40, big ? 300 : 190);
      pt.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.3, big ? 0.9 : 0.6), max: 0.9, r: rnd(2, big ? 7 : 5), col: cols[(Math.random() * cols.length) | 0], kind: 'spark' });
    }
    for (let i = 0; i < n / 3; i++) puff(x + rnd(-8, 8), y + rnd(-8, 8), 'rgba(40,40,50,0.55)', rnd(8, big ? 20 : 13), rnd(0.5, 1), rnd(-30, 30), rnd(-40, -5));
  }
  function updParts(dt) {
    for (const p of pt) {

      else if (p.kind === 'flash') p.r += dt * 40;

  /* ---------- gameplay ---------- */
  function mkEnemy(type, y) {
    const d = DEF[type], L = level();
    const e = { type, x: W + 70, y, y0: y, t: 0, ph: rnd(0, 6), amp: rnd(14, 50), hp: d.hp, w: d.w, h: d.h, sp: d.sp + L * 6, cd: rnd(1, 3), score: d.score, flash: 0, s: d.s, vy: 0 };
    if (type === 'diver') { e.x = W + 40; e.mode = 'enter'; e.aim = 0.7; e.dvx = 0; e.dvy = 0; }
    if (type === 'mine') { e.amp = rnd(20, 45); e.sp = d.sp + L * 2; }
    return e;
  }
  function spawn() {
    const L = level();
    const wt = { scout: 10, ace: L >= 2 ? 4 : 0, diver: L >= 2 ? 3 : 0, mine: L >= 3 ? 2 : 0, bomber: L >= 3 ? 1.5 : 0 };
    let tot = 0; for (const k in wt) tot += wt[k];
    let r = Math.random() * tot, type = 'scout';
    for (const k in wt) { if (wt[k] > 0 && (r -= wt[k]) <= 0) { type = k; break; } }
    const y = rnd(60, H - 70);
    if (type === 'scout' && L >= 2 && Math.random() < 0.3) {
      for (const [dx, dy] of [[0, 0], [46, -40], [46, 40]]) {
        const e = mkEnemy('scout', clamp(y + dy, 50, H - 50)); e.x += dx; e.ph = 0; e.amp = 14; e.cd = rnd(1.5, 3.5); en.push(e);
      }

  }
  function efire(x, y, n, spread, spd) {
    const a0 = Math.atan2(P.y - y, P.x - x);
    for (let i = 0; i < n; i++) {
      const a = a0 + (i - (n - 1) / 2) * spread;
      eb.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 5 });
    }
  }
  function ring(x, y, n, spd, off) {
    for (let i = 0; i < n; i++) { const a = off + i / n * 6.283; eb.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 5 }); }
  }
  const PK_COL = { heart: '#ff7aa8', star: '#f2b632', shield: '#6ec6ff', spread: '#a47fcb', bomb: '#7a8794' };
  function randKind() {
    const w = { heart: 3, star: 3, shield: 2, spread: 2, bomb: 1 };

    for (const k in w) { if ((r -= w[k]) <= 0) return k; }

  function drop(x, y, kind) {
    pk.push({ x, y, vx: -35, t: rnd(0, 6), kind: kind || randKind() });
  }
  function applyPickup(kind) {

    else if (kind === 'star') P.rapid = 8;
    else if (kind === 'spread') P.spread = 9;
    else if (kind === 'shield') P.shield = 12;

  function detonate() {

  function killEnemy(e) {

    if (e.type === 'bomber') drop(e.x, e.y); else if (Math.random() < 0.06) drop(e.x, e.y);

  function hurt() {

  /* tutorial */
  function spawnTarget() {
    const e = mkEnemy('scout', rnd(90, H - 90)); e.x = W + 50; e.holdX = W * 0.7; e.cd = 99999; e.amp = 18; en.push(e);
  }
  function tutNext() {
    tut.step++; tut.t = 0; sfx('step');

  }
  function endTut() {
    tut = null; en = []; eb = []; pk = []; bullets = []; score = 0; kills = 0; spawnT = 1.5; P.rapid = 0; paused = false; ovPause.hidden = true;
    setMusic('play'); updUI();
  }
  function updTut(dt) {
    tut.t += dt;

    else if (tut.step === 1) { if (!en.some(e => e.hp > 0)) { if (tut.tkills >= 2) tutNext(); else spawnTarget(); } }
    else if (tut.step === 2) { if (tut.looped) { tut.lt += dt; if (tut.lt > 0.9) tutNext(); } }

  function update(dt) {
    worldX += (state === 'play' ? 70 + level() * 4 : 50) * dt;
    for (const c of clouds) { c.x -= c.sp * dt; if (c.x < -140) { c.x += W + 300; c.y = rnd(30, 280); } }
    shake = Math.max(0, shake - dt); flashW = Math.max(0, flashW - dt);
    if (themeT < 1) themeT = Math.min(1, themeT + dt / 2.5);
    if (stageMsg) { stageMsg.t -= dt; if (stageMsg.t <= 0) stageMsg = null; }
    bolt = Math.max(0, bolt - dt);
    if (THEMES[themeTo].rain || (themeT < 1 && THEMES[themeFrom].rain)) {
      nextBolt -= dt;
      if (nextBolt <= 0) { bolt = 0.3; boltX = rnd(80, W - 80); nextBolt = rnd(3.5, 8); sfx('thunder'); }
    }
    updParts(dt);
    if (state !== 'play') return;

    if (P.dead) {
      deadT += dt;
      if (deadT > 1.4) { state = 'over'; lastRun = { score, wave: level(), bosses: bossesDone }; setMusic('title'); updUI(); offerScore(); }
    } else {
      P.inv = Math.max(0, P.inv - dt); P.fire -= dt; P.rapid = Math.max(0, P.rapid - dt); P.spread = Math.max(0, P.spread - dt); P.shield = Math.max(0, P.shield - dt); P.loopCd = Math.max(0, P.loopCd - dt);
      if (P.loop > 0) P.loop = Math.max(0, P.loop - dt);
      let ax = 0, ay = 0;
      if (keys.ArrowLeft || keys.KeyA) ax -= 1; if (keys.ArrowRight || keys.KeyD) ax += 1;
      if (keys.ArrowUp || keys.KeyW) ay -= 1; if (keys.ArrowDown || keys.KeyS) ay += 1;
      if (ptr) {
        P.vx = clamp((ptr.x + offX - P.x) * 8, -400, 400);
        P.vy = clamp((ptr.y + offY - P.y) * 8, -400, 400);
      } else {
        const k = Math.min(1, dt * 8);

      }
      P.x = clamp(P.x + P.vx * dt, 40, W - 70); P.y = clamp(P.y + P.vy * dt, 34, H - 34);
      P.ang = P.loop > 0 ? -(1 - P.loop / LOOP_T) * Math.PI * 2 : clamp(P.vy / 380, -1, 1) * 0.35;

      if ((keys.Space || btnFire || autoFire) && P.fire <= 0 && P.loop <= 0) {
        if (P.spread > 0) bullets.push({ x: P.x + 36, y: P.y + 2, vx: 640 }, { x: P.x + 34, y: P.y - 2, vx: 620, vy: -120 }, { x: P.x + 34, y: P.y + 6, vx: 620, vy: 120 });
        else { bullets.push({ x: P.x + 36, y: P.y + 2, vx: 640 }); if (P.rapid > 0) bullets.push({ x: P.x + 30, y: P.y - 7, vx: 640 }); }
        P.fire = P.rapid > 0 ? 0.12 : 0.22;
        pt.push({ x: P.x + 42, y: P.y + 2, vx: 0, vy: 0, life: 0.07, max: 0.07, r: 5, col: '#fff3b0', kind: 'flash' });
        sfx('shoot');
      }
      P.puff -= dt; if (P.puff <= 0) { P.puff = 0.06; puff(P.x - 34, P.y + 2, 'rgba(246,234,208,0.6)', 3, 0.35, -60, rnd(-6, 6)); }
      if (P.hp <= 1) { P.smoke -= dt; if (P.smoke <= 0) { P.smoke = 0.07; puff(P.x - 10, P.y - 4, 'rgba(30,30,38,0.6)', 6, 0.7, -50, rnd(-25, -5)); } }
    }

    if (tut && !P.dead) updTut(dt);

    // spawning and the boss warning
    if (!P.dead && !tut) {
      if (!boss && !bossPending && kills >= nextBoss) { bossPending = true; warn = 2.4; lastWarnK = -1; setMusic('boss'); }
      if (bossPending) {
        warn -= dt;
        const wk = Math.floor(warn * 2.2); if (wk !== lastWarnK) { lastWarnK = wk; if (warn > 0) sfx('warn'); }
        if (warn <= 0) { bossPending = false; startBoss(); }
      } else if (!boss) {
        spawnT -= dt;

      }
    }

    // player bullets
    for (const b of bullets) { b.x += b.vx * dt; if (b.vy) b.y += b.vy * dt; }
    for (const b of bullets) {
      if (b.dead) continue;
      for (const e of en) {
        if (e.hp > 0 && Math.abs(b.x - e.x) < e.w / 2 && Math.abs(b.y - e.y) < e.h / 2) {
          b.dead = true; e.hp--; e.flash = 0.08; sfx('ping');

      }
      if (!b.dead && boss) {

        }

    }

    // enemies
    for (const e of en) {
      e.t += dt; const py = e.y;

        else if (e.mode === 'aim') {

          if (e.aim <= 0) { const a = Math.atan2(P.y - e.y, P.x - e.x), sp = 300 + level() * 10; e.dvx = Math.cos(a) * sp; e.dvy = Math.sin(a) * sp; e.mode = 'dive'; sfx('dive'); }
        } else { e.x += e.dvx * dt; e.y += e.dvy * dt; }
      } else if (e.type === 'mine') {
        e.x -= e.sp * dt; e.y = e.y0 + Math.sin(e.t * 1.6 + e.ph) * e.amp;
      } else {

    en = en.filter(e => e.hp > 0 && e.x > -110 && e.x < W + 260 && e.y > -130 && e.y < H + 130);

        else if (B.s === 'strafe') {

  const ovScore = $('ovScore'), ovBoard = $('ovBoard'), iniEl = $('ini'), sMsg = $('sMsg'), sSave = $('sSave'), bList = $('bList'), bNote = $('bNote');

  function renderBoard() {
    bList.textContent = '';
    if (hs.err) { bNote.textContent = 'The board is unavailable right now.'; return; }
    if (!hs.docs) { bNote.textContent = 'Loading scores...'; return; }
    if (!hs.docs.length) { bNote.textContent = 'No scores yet. Be the first ace on the board.'; return; }
    bNote.textContent = hs.canWrite ? '' : 'You can read the board. Posting a score needs contributor access to this page.';
    hs.docs.forEach((d, i) => {
      const li = document.createElement('li'); if (hs.uid && d.id === hs.uid) li.className = 'me';
      const parts = [['rk', String(i + 1)], ['nm', cleanIni(d.name) || '???'], ['sc', String(whole(d.score))], ['wv', 'W' + (whole(d.wave) || 1)]];
      for (const [cls, text] of parts) { const s = document.createElement('span'); s.className = cls; s.textContent = text; li.appendChild(s); }

  }
  function openBoard() {

  }
  function closeBoard() { ovBoard.hidden = true; }
  function skipScore() { ovScore.hidden = true; }

  async function offerScore() {
    if (!hs.db || !hs.canWrite || !hs.uid || lastRun.score <= 0) return;
    let prev = 0;
    try { const s = await hs.db.doc('scores/' + hs.uid).get(); if (s.exists) prev = whole(s.data().score); } catch (e) {}
    if (state !== 'over' || lastRun.score <= prev || modalOpen()) return;
    let saved = ''; try { saved = localStorage.getItem('aw_ini') || ''; } catch (e) {}
    iniEl.value = cleanIni(saved); sMsg.textContent = ''; sSave.disabled = false;
    $('sTitle').textContent = prev ? 'NEW PERSONAL BEST' : 'POST YOUR SCORE';
    $('sInfo').textContent = 'Score ' + lastRun.score + '  ·  Wave ' + lastRun.wave + '  ·  Bosses ' + lastRun.bosses;
    ovScore.hidden = false;
    try { iniEl.focus({ preventScroll: true }); iniEl.select(); } catch (e) {}
  }
  async function saveScore() {
    if (sSave.disabled) return;
    const ini = cleanIni(iniEl.value);
    if (!ini) { sMsg.textContent = 'Type 1 to 3 letters or numbers.'; iniEl.focus(); return; }
    try { localStorage.setItem('aw_ini', ini); } catch (e) {}
    sSave.disabled = true; sMsg.textContent = 'Saving...';
    try {
      const ref = hs.db.doc('scores/' + hs.uid), cur = await ref.get();
      const prev = cur.exists ? whole(cur.data().score) : 0;
      if (lastRun.score > prev) await ref.set({ name: ini, score: lastRun.score, wave: lastRun.wave, bosses: lastRun.bosses, ts: Date.now() });
      else if (cur.exists && cur.data().name !== ini) await ref.update({ name: ini });
      openBoard();
    } catch (e) {
      sSave.disabled = false;
      sMsg.textContent = e && e.code === 'quota_exceeded' ? 'The board is full right now.' : 'Could not save. Check your connection and try again.';
    }
  }
  iniEl.addEventListener('input', () => { iniEl.value = cleanIni(iniEl.value); });
  sSave.addEventListener('click', saveScore);
  $('sSkip').addEventListener('click', skipScore);
  $('bClose').addEventListener('click', closeBoard);
  togScores.addEventListener('click', openBoard);

  (async () => {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db) return;
      hs.db = db;
      if (user) { hs.uid = await user.id(); const cw = await user.can('data.write'); hs.canWrite = !!hs.uid && cw !== false; }
      db.collection('scores').orderBy('score', 'desc').limit(10).onSnapshot(
        snap => { hs.docs = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id })); hs.err = false; renderBoard(); },
        () => { hs.err = true; renderBoard(); }
      );
      updUI();
    } catch (e) { hs.db = null; updUI(); }
  })();

  /* ---------- loop ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (!paused) { T += dt; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }

  fit();
  updUI();
  setMusic('title');
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage); else addEventListener('resize', fit);
  if (document.fonts && document.fonts.load) { document.fonts.load('20px Bungee'); document.fonts.load('16px Fredoka'); }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
